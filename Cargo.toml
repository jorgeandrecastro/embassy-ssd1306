
[package]
edition = "2024"
name = "embassy-ssd1306"
version = "0.7.4"
authors = ["Jorge Andre Castro <georgeandrec@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Async no_std driver for the SSD1306 OLED display over I2C, based on Embassy."
documentation = "https://docs.rs/embassy-ssd1306"
readme = "README.md"
keywords = ["embassy", "ssd1306", "oled", "no-std", "hardware-support"]
categories = ["embedded", "no-std", "hardware-support"]
license = "GPL-2.0-or-later"
repository = "https://github.com/jorgeandrecastro/embassy-ssd1306"

[lib]
name = "embassy_ssd1306"
path = "src/lib.rs"

[features]
# ARM / Cortex-M: official Embassy backend
default = ["time-upstream"]
time-upstream = ["dep:embassy-time"]

# RP2350 Hazard3 RISC-V: custom Embassy fork
time-riscv = ["dep:embassy-time-riscv"]

[dependencies]
embedded-hal-async = "1.0"

embassy-time = {
    version = "0.5",
    optional = true,
    default-features = false
}

embassy-time-riscv = {
    package = "embassy-time-riscv",
    version = "0.1.2",
    optional = true,
    default-features = false
}

embassy-time-driver-riscv = {
    version = "0.1",
    optional = true,
    default-features = false
}
