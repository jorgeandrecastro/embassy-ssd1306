[package]
edition = "2024"
name = "embassy-ssd1306"
version = "0.7.1"
authors = ["Jorge Andre Castro <georgeandrec@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Async no_std driver for the SSD1306 OLED display over I2C, based on Embassy."
documentation = "https://docs.rs/embassy-ssd1306"
readme = "README.md"
keywords = [
    "embassy",
    "ssd1306",
    "oled",
    "no-std",
    "embedded",
]
categories = [
    "embedded",
    "no-std",
    "hardware-support",
]
license = "GPL-2.0-or-later"
repository = "https://github.com/jorgeandrecastro/embassy-ssd1306"

[lib]
name = "embassy_ssd1306"
path = "src/lib.rs"

[dependencies.embassy-time]
version = "0.5"

[dependencies.embedded-hal-async]
version = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true